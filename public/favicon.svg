<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="gold" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#DFBF85" />
      <stop offset="45%" stop-color="#C49B58" />
      <stop offset="100%" stop-color="#9C7332" />
    </linearGradient>
    <linearGradient id="petal" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FAF1E8" />
      <stop offset="50%" stop-color="#EADBCE" />
      <stop offset="100%" stop-color="#D9BFAD" />
    </linearGradient>
    <linearGradient id="petalR" x1="80%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#F8EFE5" />
      <stop offset="50%" stop-color="#E4D3C3" />
      <stop offset="100%" stop-color="#CFB5A0" />
    </linearGradient>
  </defs>

  <!-- Circular background badge for crisp favicon contrast in both light & dark browser tabs -->
  <circle cx="50" cy="50" r="48" fill="#FAF7F2" stroke="url(#gold)" stroke-width="1.2" />

  <!-- Outer circular arc -->
  <path d="M 23,65 A 34,34 0 1 1 78,63" stroke="url(#gold)" stroke-width="1.8" stroke-linecap="round" />

  <!-- Top ascending dots -->
  <circle cx="50" cy="18" r="1.3" fill="url(#gold)" />
  <circle cx="50" cy="23" r="2" fill="url(#gold)" />

  <!-- Golden Sun Sphere -->
  <circle cx="50" cy="32" r="6" fill="url(#gold)" />

  <!-- Left Petal -->
  <path d="M 49,70 C 38,59 31,46 36,36 C 44,40 48,52 49,70 Z" fill="url(#petal)" stroke="url(#gold)" stroke-width="1.1" stroke-linejoin="round" />

  <!-- Right Petal -->
  <path d="M 49,70 C 58,59 65,46 60,36 C 53,40 49,52 49,70 Z" fill="url(#petalR)" stroke="url(#gold)" stroke-width="1.1" stroke-linejoin="round" />

  <!-- Third subtle petal overlap -->
  <path d="M 49,70 C 62,65 67,54 64,45 C 57,50 51,59 49,70 Z" fill="url(#petalR)" opacity="0.65" />

  <!-- Central stem line -->
  <path d="M 49,70 C 48.5,57 48.5,46 50,36" stroke="url(#gold)" stroke-width="1.2" stroke-linecap="round" />

  <!-- Bottom sweeping flourish curves -->
  <path d="M 33,69 C 41,75 48,69 64,61" stroke="url(#gold)" stroke-width="1.4" stroke-linecap="round" />
  <path d="M 28,65 C 36,69 44,67 50,69" stroke="url(#gold)" stroke-width="1.1" stroke-linecap="round" />
</svg>
